<style>
:root{--bg1:#fff7ec;--bg2:#ffe3ea;--fg:#201a2b;--card:#fff;--bd:rgba(0,0,0,.07);--mut:#7d7589;--c0:#ef4b5b;--c1:#3b82f6;--c2:#f5b82e;--c3:#22b394;--c4:#8b5cf6;--board:#e9e2f2;--cell:rgba(60,30,100,.1);--stone:#8a8a93;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#171326;--bg2:#241a3a;--fg:#fff;--card:#2a2242;--bd:rgba(255,255,255,.09);--mut:#a99fc4;--board:#2f2650;--cell:rgba(255,255,255,.07);--stone:#6b6b78;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#171326;--bg2:#241a3a;--fg:#fff;--card:#2a2242;--bd:rgba(255,255,255,.09);--mut:#a99fc4;--board:#2f2650;--cell:rgba(255,255,255,.07);--stone:#6b6b78;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 16px 12px;gap:14px}
.screen>*{flex-shrink:0}
#home{overflow-y:auto}
[hidden]{display:none!important}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;border:0;cursor:pointer}
.top{width:min(92vw,420px);display:flex;gap:8px}
.pill{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px 10px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:76px}
.logo i{aspect-ratio:1;border-radius:30%;animation:fl 2.4s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:20px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.3)}
.logo i:nth-child(2){animation-delay:.3s}.logo i:nth-child(3){animation-delay:.6s}.logo i:nth-child(4){animation-delay:.9s}
@keyframes fl{50%{transform:translateY(-5px) rotate(5deg)}}
h1{margin:0;font-size:36px;font-weight:900}
.hero{width:min(92vw,420px);border-radius:28px;padding:18px;color:#fff;background:linear-gradient(135deg,#4f8cff,#22b394);box-shadow:0 8px 0 #1b6d78;cursor:pointer}
.hero:active{transform:translateY(5px);box-shadow:0 3px 0 #1b6d78}
.hl{display:flex;justify-content:space-between;align-items:center}
.hero h2{margin:0;font-size:30px;font-weight:900}
.best{background:rgba(255,255,255,.22);border-radius:14px;padding:5px 12px;font-weight:800}
.hero p{margin:6px 0 14px;opacity:.95;font-size:14px}
.go{background:#fff;color:#1b6d78;border-radius:18px;padding:13px;font-weight:900;font-size:21px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.grid2{display:flex;gap:12px;width:min(92vw,420px)}
.tile2{flex:1;border-radius:22px;padding:14px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);text-align:start;min-height:112px;display:flex;flex-direction:column;gap:2px}
.tile2:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tile2 em{font-style:normal;font-size:30px}
.tile2 span{font-size:14px;font-weight:800}.tile2 b{font-size:13px;opacity:.92;font-weight:600}

@keyframes hnp{50%{transform:scale(1.04)}}
#hv .ar i{background:#ff8a00;width:20px;height:32px;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.35))}

.t:not(.s):not(.k):not(.m) span{box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.25)!important}
.t span{transition:transform .1s,opacity .1s}
.t.nw span{animation:in .14s}
#board.gl::after{transition:none}
.lite .m.boss::before{display:none}
.lite .m span{box-shadow:inset 0 0 0 2px var(--mg)!important}

/* ===== v6: هوية جديدة · مشاغبين · أيقونات ===== */
:root:root:root{color-scheme:dark;--bg1:#15112e;--bg2:#1f1647;--fg:#f6f2ff;--card:#2a2052;--bd:rgba(255,255,255,.12);--mut:#b9b0dc;--board:#20184a;--cell:rgba(255,255,255,.075);--stone:#7b8197;--c0:#f0476a;--c1:#3f7bff;--c2:#ffb627;--c3:#12b999;--c4:#9a63ff;--bgbase:linear-gradient(170deg,#14102c,#1d1544 55%,#120e26);--blobs:radial-gradient(60% 36% at 0 0,rgba(240,71,106,.30),transparent 70%),radial-gradient(55% 34% at 100% 12%,rgba(63,123,255,.28),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(18,185,153,.24),transparent 70%),radial-gradient(50% 34% at 0 88%,rgba(255,182,39,.18),transparent 70%)}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cr{width:1.3em;height:1.3em;vertical-align:-.3em}
.g0,.g1,.g2,.g3,.g4{background:linear-gradient(155deg,var(--a),var(--b))}
.g0{--a:#ff8fa5;--b:#d92a52}.g1{--a:#8bb7ff;--b:#2a58df}.g2{--a:#ffdb6e;--b:#ee8a00}.g3{--a:#62efd2;--b:#0b9680}.g4{--a:#c9aaff;--b:#7237dc}
.t:not(.s):not(.k):not(.m) span[class^=g]{background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 48%,rgba(0,0,0,.18)),linear-gradient(155deg,var(--a),var(--b))!important}
.t span svg{width:56%;height:56%;position:relative}
.logo i svg{width:55%;height:55%}.logo i{color:#fff}
.k span{background:linear-gradient(160deg,#9aa0b5,#5d6379)!important}.k span svg{width:82%;height:82%}
.m.ghost{--mg:#8f7bff}.m.muncher{--mg:#ff8a2a}.m.octopus{--mg:#5a6cff}.m.dragon{--mg:#12b890}
.m span{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--mg) 30%,#fff))!important;box-shadow:inset 0 0 0 3px var(--mg),inset 0 -8px 12px color-mix(in srgb,var(--mg) 25%,transparent),0 3px 0 rgba(0,0,0,.25)!important;padding-bottom:12px}
.m span svg{width:74%;height:74%;margin-top:-4px;filter:none}
.m.warn span{box-shadow:inset 0 0 0 3px #ff3b5c,0 0 14px #ff3b5c!important}
.ink svg{opacity:0}
h1{background:linear-gradient(90deg,#ffe7a3,#ffb627 50%,#ff7a8a)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent}

.go{background:linear-gradient(180deg,#ffe08a,#ffb627);color:#4a2c00;box-shadow:0 4px 0 #b9770e}
.best{display:flex;align-items:center;gap:4px}
.chest{background:linear-gradient(135deg,#ffb627,#f0476a)}.chest .ic{width:1.2em;height:1.2em}

.tile2 em .ic{width:30px;height:30px}.mis>i .ic{width:28px;height:28px;color:var(--c2)}

.bb .ic{width:34px;height:34px;color:#fff;stroke-width:2.2}.bb small .ic{width:1em;height:1em;vertical-align:-.15em}
.st i .ic,.st i .cr,.st i svg{width:32px;height:32px}

.screen:not([hidden]){animation:sin .3s ease-out}@keyframes sin{from{opacity:0;transform:translateY(10px) scale(.985)}}
button:focus-visible,[role=button]:focus-visible{outline:3px solid #ffd95a;outline-offset:2px}
#xt{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:400;background:rgba(20,14,50,.94);color:#fff;border:1px solid rgba(255,255,255,.15);padding:9px 18px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .2s}#xt:empty{opacity:0}

.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
#modal button.lv{margin:0;padding:8px 2px;width:auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.08);box-shadow:none;border-radius:16px;color:var(--fg);font-size:18px}
#modal button.lv.cur{background:linear-gradient(135deg,#3f7bff,#9a63ff);box-shadow:0 0 0 2px #ffd95a}#modal button.lv.lk{opacity:.35}
.lv small{color:#ffc53d;font-size:12px;letter-spacing:1px;min-height:14px}.lv .gi{display:flex}.lv .gi svg,.lv .gi .mini{width:22px;height:22px}
.mini{display:inline-flex;width:1.3em;height:1.3em;border-radius:30%;vertical-align:-.3em;align-items:center;justify-content:center}.mini svg{width:68%;height:68%}.st .mini{width:32px;height:32px}

/* ===== v7: أداء + تأثيرات ===== */
.t span svg{filter:none!important}
.nav{gap:0}.nav button{padding:4px 8px;font-size:11px;min-width:0;transition:transform .12s}.nav button:active{transform:scale(.9)}
#home:not([hidden])>*{animation:rise .55s cubic-bezier(.2,.9,.3,1) backwards}
#home>:nth-child(2){animation-delay:.05s}#home>:nth-child(3){animation-delay:.1s}#home>:nth-child(4){animation-delay:.15s}#home>:nth-child(5){animation-delay:.2s}#home>:nth-child(6){animation-delay:.25s}#home>:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
#home .go::after{display:block}
.lite #home>*,.lite #home .go::after{animation:none}.lite #home .go::after{display:none}
.tile2,.hero,.chest{transition:filter .15s}.tile2:active,.chest:active{filter:brightness(1.12)}
#vg{position:fixed;inset:0;pointer-events:none;z-index:150;opacity:0;background:radial-gradient(120% 90% at 50% 50%,transparent 52%,rgba(var(--vc,255,182,39),.55))}
.sr{display:flex;justify-content:center;gap:6px;margin:4px 0 8px}.sr .ic{width:46px;height:46px}

@keyframes starp{from{transform:scale(0) rotate(-120deg);opacity:0}}
.lv small .ic{width:12px;height:12px;vertical-align:-1px}.lv small .ic.off{opacity:.25;filter:grayscale(1)}

#gm{display:inline-block}.m.frost{--mg:#5ec8ff}

<script>
/* تحديث تلقائي: يفحص لو فيه نسخة جديدة من اللعبة ويحمّلها وقت ما تكون في الصفحة الرئيسية */
(function(){
  var K="milo_ver",busy=0;
  function h(s){var x=5381,i=s.length;while(i)x=(x*33)^s.charCodeAt(--i);return String(x>>>0)}
  function idle(){var el=document.getElementById("home");return el&&!el.hidden}
  function check(){
    if(busy||!navigator.onLine)return;busy=1;
    fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():null}).then(function(t){
      busy=0;if(!t)return;
      var n=h(t),o=null;try{o=localStorage.getItem(K)}catch(e){}
      if(o===null){try{localStorage.setItem(K,n)}catch(e){}return}
      if(o!==n&&idle()){try{localStorage.setItem(K,n)}catch(e){}location.reload()}
    }).catch(function(){busy=0});
  }
  setTimeout(check,3000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
  setInterval(check,120000);
})();
</script>
